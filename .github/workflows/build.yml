name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build sshush
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          for i in 1 2 3; do
            go build -o /dev/null ./cmd/sshush && exit 0
            echo "build failed (attempt $i), retrying..."
          done
          exit 1
      - name: build sshushd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          for i in 1 2 3; do
            go build -o /dev/null ./cmd/sshushd && exit 0
            echo "build failed (attempt $i), retrying..."
          done
          exit 1
