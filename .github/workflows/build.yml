name: build

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    # Every package for every target, as releases are built: without cgo. A
    # file only one OS compiles, such as the Windows tray, is checked here
    # for both architectures, not only on the OS that runs the tests.
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        run: |
          for i in 1 2 3; do
            go build ./... && exit 0
            echo "build failed (attempt $i), retrying..."
          done
          exit 1
      - name: vet
        run: go vet ./...

  # Packs the MSIX (packaging/msix) with the Windows SDK's makeappx, which
  # checks the manifest against its schema: a manifest the Store would refuse
  # fails here rather than at release time.
  msix:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        run: |
          go build -o build/windows-amd64/sshush.exe ./cmd/sshush
          go build -o build/windows-amd64/sshushd.exe ./cmd/sshushd
          go build -ldflags -H=windowsgui -o build/windows-amd64/sshush-tray.exe ./cmd/sshush-tray
      - name: pack
        run: |
          bash scripts/msix.sh stage dev x64 build/windows-amd64 build/msix-amd64
          bash scripts/msix.sh pack build/msix-amd64 build/sshush-dev-windows-amd64.msix
