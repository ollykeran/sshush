name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # A tag does not run test.yml, and the release job below tests on Linux only:
  # without this the Windows binaries would be published untested.
  windows:
    uses: ./.github/workflows/windows-tests.yml

  release:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - uses: extractions/setup-just@v3

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: test 
        run: just test

      - name: Get tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: just pkg all

      - name: Validate artifacts
        run: just check-artifacts ${{ steps.tag.outputs.version }}

      - name: Generate checksums
        run: just checksums

      # The msix job packs these very binaries, so the Store build matches the
      # published checksums that sshush selftest compares against.
      - name: Keep the Windows binaries for the MSIX
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-binaries
          path: build/windows-amd64/*.exe
          if-no-files-found: error

      # A tag with a suffix, such as v0.1.1-test.1, makes a draft pre-release:
      # the whole pipeline runs, MSIX included, but only maintainers see the
      # result until it is published or deleted.
      - name: Release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v3
        with:
          draft: ${{ contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            build/sshush-*-linux-amd64.tar.gz
            build/sshush-*-darwin-*.tar.gz
            build/sshush-*-windows-amd64.zip
            build/sshush-*.deb
            build/sshush-*.rpm
            build/sshush-*.pkg.tar.zst
            build/*.sha256

  # The MSIX for the Microsoft Store, packed from the release job's Windows
  # binaries. It is unsigned (the Store signs what it publishes), so it is kept
  # as a workflow artifact to upload in Partner Center rather than attached to
  # the GitHub release, where nobody could install it. The package identity
  # comes from repository variables holding what Partner Center reserved for
  # the app; see packaging/msix/README.md.
  msix:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: windows-amd64-binaries
          path: build/windows-amd64

      - name: Build the MSIX
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          if [ -z "$MSIX_IDENTITY_NAME" ] || [ -z "$MSIX_PUBLISHER" ]; then
            echo "::warning::MSIX_IDENTITY_NAME or MSIX_PUBLISHER is not set, so this package has a local identity the Store will refuse"
          fi
          bash scripts/msix.sh stage "$version" x64 build/windows-amd64 build/msix-amd64
          bash scripts/msix.sh pack build/msix-amd64 "build/sshush-$version-windows-amd64.msix"

      - uses: actions/upload-artifact@v4
        with:
          name: sshush-msix
          path: build/sshush-*-windows-amd64.msix
          if-no-files-found: error
