name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: extractions/setup-just@v3

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: test 
        run: just test

      - name: Get tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: just pkg all

      - name: Validate artifacts
        run: just check-artifacts ${{ steps.tag.outputs.version }}

      - name: Release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/sshush-*-linux-amd64.tar.gz
            build/sshush-*-darwin-*.tar.gz
            build/sshush-*.deb
            build/sshush-*.rpm
            build/sshush-*.pkg.tar.zst
