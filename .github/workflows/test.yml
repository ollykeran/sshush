name: test

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v3
      - run: just test-cover
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: benchmarks/coverage.out

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v3
      - run: just test

  # The Windows agent on its own, and the WSL relay to it across the real
  # boundary. Shared with release.yml, which will not publish without them.
  windows:
    uses: ./.github/workflows/windows-tests.yml

  coverage:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate coverage report
        run: go run ./scripts/cover-report -profile coverage.out > cover-report.md
      - name: Post coverage comment
        if: env.ACT != 'true'
        uses: thollander/actions-comment-pull-request@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: coverage-report
          file-path: cover-report.md
