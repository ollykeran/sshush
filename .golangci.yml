version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
  exclusions:
    generated: strict
    rules:
      # Exclude staticcheck quickfix suggestions (QF) — informational only
      - linters:
          - staticcheck
        text: "QF1"
      # Exclude deprecated API warnings until the codebase migrates
      - linters:
          - staticcheck
        text: "SA1019"
      # internal/tray keeps its layout and state code out of _windows.go files
      # so it is tested on every OS, but only the _windows.go files call it: on
      # any other GOOS it all looks unused. lint.yml checks unused there with
      # GOOS=windows instead.
      - linters:
          - unused
        path: internal/tray/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
